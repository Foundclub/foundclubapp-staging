commands:
  generate_env:
    steps:
      - run:
          name: Display environment info
          command: |
            echo "===== Environment Variables Info ====="
            echo "ENV: $ENV"
            echo "GIT_TAG: ${GIT_TAG:-'not set'}"
            echo "======================================="
      - run:
          name: Generate .env file
          command: bash env_generator.sh
      - run:
          name: Display generated .env (masked)
          command: |
            echo "===== Generated .env file ====="
            if [ -f .env ]; then
              # Afficher les noms des variables et masquer partiellement les valeurs
              while IFS= read -r line; do
                if [[ -n "$line" && ! "$line" =~ ^# ]]; then
                  var_name=$(echo "$line" | cut -d '=' -f 1)
                  var_value=$(echo "$line" | cut -d '=' -f 2-)
                  # Masquer les valeurs sensibles (SENTRY_DSN, tokens, etc.)
                  if [[ "$var_name" =~ (DSN|TOKEN|KEY|SECRET|PASSWORD) ]]; then
                    echo "$var_name=***MASKED***"
                  elif [[ -n "$var_value" && ${#var_value} -gt 10 ]]; then
                    # Afficher les 10 premiers caractères pour les URLs longues
                    echo "$var_name=${var_value:0:10}...${var_value: -5}"
                  else
                    echo "$var_name=$var_value"
                  fi
                fi
              done < .env
            else
              echo ".env file not found!"
            fi
            echo "================================"       echo ".env file not found!"
            fi
            echo "================================"

  ios_build:
    parameters:
      fastlane-lane:
        type: string
        default: ios deploy_build
    steps:
      - generate_env
      - add_ssh_keys: # THEN set the *new* SSH key for gitlab.
          fingerprints:
            - "SHA256:yq4j8vrgqFMWbseNEYZV3G0gTuOsO7Qq0OJpHuGKfZU"
      - node/install:
          install-yarn: false
          node-version: "20"
      - run: node --version
      - run:
          name: bundle install
          command: cd ios && bundle install
      - run:
          name: firebase_service_account
          command: |
            echo $FIREBASE_SERVICE_ACCOUNT > "./ios/private-key.json"
            export GOOGLE_APPLICATION_CREDENTIALS="./private-key.json"
      - run:
          name: fastlane env
          command: cd ios && bundle exec fastlane env
      - run:
          name: npm
          command: npm install
      - restore_cache:
          name: Restore pods cache
          key: 1-pods-{{ checksum "ios/Podfile.lock" }}
      - run:
          name: fastlane
          command: cd ios && bundle exec pod install --deployment && bundle exec fastlane << parameters.fastlane-lane >>

      # Store only the IPA file
      - store_artifacts:
          path: ios/output/foundclub.ipa
          destination: foundclub.ipa

      - save_cache:
          name: Save pods cache
          key: 1-pods-{{ checksum "ios/Podfile.lock" }}
          paths:
            - ./ios/Pods

  android_build:
    parameters:
      fastlane-lane:
        type: string
        default: android deploy_build
    steps:
      - generate_env
      - node/install:
          install-yarn: false
          node-version: "20"
      - run: npm install
      - run:
          name: firebase_service_account
          command: |
            echo $FIREBASE_SERVICE_ACCOUNT > "./android/private-key.json"
            export GOOGLE_APPLICATION_CREDENTIALS="./private-key.json"
      - run:
          name: Install Ninja
          command: |
            sudo apt-get update && sudo apt-get install -y ninja-build
      - run:
          name: Install CMake
          command: |
            wget https://github.com/Kitware/CMake/releases/download/v3.23.2/cmake-3.23.2-Linux-x86_64.tar.gz
            tar -xzvf cmake-3.23.2-Linux-x86_64.tar.gz -C $HOME
            export PATH=$HOME/ninja:$HOME/cmake-3.23.2-Linux-x86_64/bin:$PATH
      - run:
          name: Set CMake and Ninja Paths
          command: |
            export PATH=$HOME/ninja:$HOME/cmake-3.23.2-Linux-x86_64/bin:$PATH
      - run:
          name: bundle install
          command: cd android && sudo bundle install
      - run:
          no_output_timeout: 30m
          name: Run fastlane android
          command: cd android && export TIMESTAMP=$(date +"%s") && fastlane << parameters.fastlane-lane >>

      # Store only the AAB file
      - store_artifacts:
          path: android/app/build/outputs/bundle/release/app-release.aab
          destination: app-release.aab


jobs:
  ios-staging:
    macos:
      xcode: "16.2.0"
    environment:
      FL_OUTPUT_DIR: output
      TIMESTAMP: $(date +"%s")
      ENV: preprod
    shell: /bin/bash --login -o pipefail
    steps:
      - checkout
      - ios_build:
          fastlane-lane: "ios deploy_build"


  android-staging:
    docker:
      - image: cimg/android:2024.11
    resource_class: xlarge
    environment:
      FL_OUTPUT_DIR: output
      ENV: preprod
    shell: /bin/bash --login -o pipefail
    steps:
      - checkout
      - android_build:
          fastlane-lane: "android deploy_build"


  ios-tag-rc:
    macos:
      xcode: "16.2.0"
    environment:
      FL_OUTPUT_DIR: output
      TIMESTAMP: $(date +"%s")
      ENV: preprod
      GIT_TAG: << pipeline.git.tag >>
    shell: /bin/bash --login -o pipefail
    steps:
      - checkout
      - ios_build:
          fastlane-lane: "ios deploy_version_rc"
      # Store only the IPA file
      - store_artifacts:
          path: ios/output/foundclub.ipa
          destination: foundclub-rc.ipa

  android-tag-rc:
    docker:
      - image: cimg/android:2024.11
    resource_class: xlarge
    environment:
      ENV: preprod
      FL_OUTPUT_DIR: output
      GIT_TAG: << pipeline.git.tag >>
    shell: /bin/bash --login -o pipefail
    steps:
      - checkout
      - android_build:
          fastlane-lane: "android deploy_version_rc"

  ios-tag:
    macos:
      xcode: "16.2.0"
    environment:
      FL_OUTPUT_DIR: output
      TIMESTAMP: $(date +"%s")
      GIT_TAG: << pipeline.git.tag >>
      ENV: prod
    shell: /bin/bash --login -o pipefail
    steps:
      - checkout
      - ios_build:
          fastlane-lane: "ios deploy_version_release"
      # Store only the IPA file
      - store_artifacts:
          path: ios/output/foundclub.ipa
          destination: foundclub-prod.ipa


  android-tag:
    docker:
      - image: cimg/android:2024.11
    resource_class: xlarge
    environment:
      FL_OUTPUT_DIR: output
      GIT_TAG: << pipeline.git.tag >>
      ENV: prod
    shell: /bin/bash --login -o pipefail
    steps:
      - checkout
      - android_build:
          fastlane-lane: "android deploy_version"

workflows:
  staging:
    jobs:
      - hold:
          type: approval
          filters:
            branches:
              only:
                - main
            tags:
              ignore: /.*/
      - ios-staging:
          requires:
            - hold
          filters:
            branches:
              only:
                - main
            tags:
              ignore: /.*/
      - android-staging:
          requires:
            - hold
          filters:
            branches:
              only:
                - main
            tags:
              ignore: /.*/

  tag-release-candidate:
    jobs:
      - hold:
          type: approval
          filters:
            tags:
              only: /^([0-9]+)\.([0-9]+)\.([0-9]+)-rc$/
            branches:
              ignore: /.*/
      - ios-tag-rc:
          requires:
            - hold
          filters:
            tags:
              only: /^([0-9]+)\.([0-9]+)\.([0-9]+)-rc$/
            branches:
              ignore: /.*/
      - android-tag-rc:
          requires:
            - hold
          filters:
            tags:
              only: /^([0-9]+)\.([0-9]+)\.([0-9]+)-rc$/
            branches:
              ignore: /.*/

  tag-release:
    jobs:
      - hold:
          type: approval
          filters:
            tags:
              only: /^([0-9]+)\.([0-9]+)\.([0-9]+)$/
            branches:
              ignore: /.*/
      - ios-tag:
          requires:
            - hold
          filters:
            tags:
              only: /^([0-9]+)\.([0-9]+)\.([0-9]+)$/
            branches:
              ignore: /.*/
      - android-tag:
          filters:
            tags:
              only: /^([0-9]+)\.([0-9]+)\.([0-9]+)$/
            branches:
              ignore: /.*/
          requires:
            - hold
