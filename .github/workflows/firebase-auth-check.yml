name: Firebase Auth Check

on:
  workflow_dispatch:

jobs:
  verify-firebase-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate secret injection
        shell: bash
        run: |
          test -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}" || (echo "Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" && exit 1)
          test -n "${{ secrets.FIREBASE_APP_ID_IOS }}" || (echo "Missing secret: FIREBASE_APP_ID_IOS" && exit 1)
          test -n "${{ secrets.FIREBASE_GROUPS }}" || (echo "Missing secret: FIREBASE_GROUPS" && exit 1)
          echo "All expected secrets are injected."

      - name: Recreate Firebase service account
        shell: bash
        run: |
          printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > firebase-service-account.json
          test -s firebase-service-account.json
          echo "firebase-service-account.json created."

      - name: Validate Firebase service account format
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("firebase-service-account.json")
          data = json.loads(path.read_text())

          required = ["type", "project_id", "private_key", "client_email"]
          missing = [key for key in required if not data.get(key)]
          if missing:
            raise SystemExit(f"Invalid Firebase service account JSON, missing keys: {', '.join(missing)}")

          print(f"Firebase service account JSON is valid for project: {data['project_id']}")
          print(f"Service account: {data['client_email']}")
          PY
