name: Firebase Auth Check

on:
  workflow_dispatch:

jobs:
  verify-firebase-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Recreate Firebase service account
        shell: bash
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > firebase-service-account.json

      - name: Validate Firebase auth
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
        run: firebase projects:list

      - name: Validate required Firebase metadata
        shell: bash
        run: |
          test -n "${{ secrets.FIREBASE_APP_ID_IOS }}"
          test -n "${{ secrets.FIREBASE_GROUPS }}"
          echo "Firebase secrets are present."
