name: iOS TestFlight Release (SECOURS - payant en prive)

# ══════════════════════════════════════════════════════════════════════════════
# ⛔ VOIE DE SECOURS. LA VOIE NORMALE EST CODEMAGIC (codemagic.yaml, gratuit).
#
# Tant que le depot est PUBLIC, ce workflow est gratuit. Des qu'il est PRIVE,
# chaque minute de Mac est FACTUREE 0,062 $ (une TestFlight ~35 min ~ 2,20 $), ou
# mange ~10 minutes du quota gratuit de 2 000 par minute de Mac.
# ⇒ ON NE LE LANCE QU'AVEC L'ACCORD EXPLICITE D'ADEL, donne pour CETTE build.
#
# Il fait EXACTEMENT ce que fait Codemagic : les etapes de preparation et de
# suivi Apple sont les MEMES scripts (scripts/ci/ios/*.py), controles sur le PC
# par `python scripts/ci/ios/test_scripts_ios.py`. Seules la signature
# (certificat + profil installes a la main ici, automatique chez Codemagic) et
# le numero de build (run_number + run_attempt ici, « dernier chez Apple + 1 »
# chez Codemagic) different. Mode d'emploi : D:/App/fc/CONSTRUIRE_LES_VERSIONS.md
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version iOS a envoyer sur TestFlight (ex 2.6.33) — AUCUN defaut, a saisir"
        required: true
      api_env:
        description: "Cible API du build (production, ou staging pour la recette sandbox sur api-staging)"
        required: false
        default: "production"
      force_revenuecat_rail:
        description: "1 pour forcer le rail RevenueCat (recette sandbox), vide sinon"
        required: false
        default: ""

jobs:
  build-and-upload-testflight:
    runs-on: macos-latest
    timeout-minutes: 100
    env:
      APP_ENV: production
      ENV: production
      IOS_WORKSPACE: ios/foundclub.xcworkspace
      IOS_SCHEME: foundclub
      IOS_CONFIGURATION: Release
      IOS_BUNDLE_ID: com.foundclub
      IOS_MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_XCODE_MAJOR=26
          XCODE_CANDIDATE=""

          echo "Installed Xcode applications:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          # Ordre CROISSANT : on prend le Xcode 26 le PLUS ANCIEN qui satisfait l'exigence Apple
          # (majeure >= 26 pour les uploads apres 2026-04-28). RAISON : le pod `fmt` (11.0.2, impose
          # par RCT-Folly de RN 0.78) NE COMPILE PAS avec le Clang des Xcode 26 recents (26.6) ->
          # "call to consteval function ... is not a constant expression" dans format-inl.h.
          # Xcode 26.0.x compile fmt correctement. La plateforme iOS eventuellement manquante est
          # installee par l'etape suivante (-downloadPlatform), donc prendre un Xcode ancien est sans risque.
          for candidate in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V) /Applications/Xcode.app; do
            if [ ! -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ]; then
              continue
            fi

            version_output="$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version)"
            version="$(printf '%s\n' "$version_output" | awk '/^Xcode /{print $2; exit}')"
            major="${version%%.*}"
            echo "$candidate -> Xcode $version"

            if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge "$REQUIRED_XCODE_MAJOR" ]; then
              XCODE_CANDIDATE="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_CANDIDATE" ]; then
            echo "::error::Xcode 26 not found on this GitHub Actions runner. Use a macOS runner image that includes Xcode 26+ before uploading iOS builds after 2026-04-28."
            exit 1
          fi

          sudo xcode-select -s "$XCODE_CANDIDATE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_CANDIDATE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XCODE_CANDIDATE"

      - name: Ensure iOS platform (SDK) is installed
        shell: bash
        run: |
          set -uo pipefail
          # ⚠️ NE PAS conditionner sur `xcodebuild -showsdks` : il LISTE le SDK iOS meme quand la
          # PLATEFORME n'est pas installee. Le SDK suffit a compiler le C/ObjC (les pods passent),
          # mais ibtool echoue ensuite avec "LaunchScreen.storyboard: error: iOS 26.0 Platform Not
          # Installed". On lance donc le telechargement INCONDITIONNELLEMENT.
          #
          # 🧨 2026-09-06 : ce telechargement N'EST PLUS un no-op quand la plateforme est deja la.
          # Mesure comparee de deux executions du MEME workflow :
          #   · 33912662536 (04/09, VERTE) — « SDKs avant » ne listait RIEN : la plateforme
          #     manquait vraiment, le telechargement a dure 3 min 53 et a reussi.
          #   · 34037523104 (06/09, ROUGE deux fois) — « SDKs avant » listait deja
          #     « iOS 26.0 » ET « Simulator - iOS 26.0 », et la commande a repondu
          #     « Unable to connect to simulator. » puis code 1.
          # Autrement dit : l'image du runner a change, la plateforme est desormais preinstallee,
          # et `-downloadPlatform` echoue au lieu de ne rien faire. Un echec de TELECHARGEMENT ne
          # doit donc plus tuer le build quand la plateforme est DEJA presente.
          #
          # ⚠️ Le controle de presence NE PEUT PAS etre `-showsdks` (voir l'avertissement ci-dessus).
          # On interroge les RUNTIMES simulateur, qui sont exactement ce que `-downloadPlatform`
          # installe : c'est le seul temoin qui distingue « SDK la » de « plateforme la ».
          echo "SDKs avant :"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || echo "  (aucun)"

          sudo xcodebuild -runFirstLaunch || true
          echo "Verification/telechargement de la plateforme iOS..."
          if ! xcodebuild -downloadPlatform iOS && ! sudo xcodebuild -downloadPlatform iOS; then
            echo "Le telechargement a echoue — la plateforme est-elle deja installee ?"
            xcrun simctl list runtimes || true
            if xcrun simctl list runtimes 2>/dev/null | grep -q 'SimRuntime\.iOS'; then
              echo "✅ Un runtime iOS est deja installe : on continue."
            else
              echo "::error::Echec de xcodebuild -downloadPlatform iOS ET aucun runtime iOS installe sur ce runner."
              exit 1
            fi
          fi

          echo "SDKs apres :"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || true

      - name: Validate Xcode and iOS SDK versions
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_XCODE_MAJOR=26
          REQUIRED_IOS_SDK_MAJOR=26

          xcode_version_output="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version_output"
          xcode_version="$(printf '%s\n' "$xcode_version_output" | awk '/^Xcode /{print $2; exit}')"
          xcode_major="${xcode_version%%.*}"

          if ! [[ "$xcode_major" =~ ^[0-9]+$ ]] || [ "$xcode_major" -lt "$REQUIRED_XCODE_MAJOR" ]; then
            echo "::error::Xcode 26+ is required, but selected Xcode version is '$xcode_version'."
            exit 1
          fi

          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          ios_sdk_major="${ios_sdk_version%%.*}"
          echo "iOS SDK version: $ios_sdk_version"

          if ! [[ "$ios_sdk_major" =~ ^[0-9]+$ ]] || [ "$ios_sdk_major" -lt "$REQUIRED_IOS_SDK_MAJOR" ]; then
            echo "::error::iOS SDK 26+ is required, but selected iphoneos SDK version is '$ios_sdk_version'."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Validate required runtime and signing secrets
        shell: bash
        run: |
          test -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64 }}" || (echo "Missing secret: GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64" && exit 1)
          test -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" || (echo "Missing secret: BUILD_CERTIFICATE_BASE64" && exit 1)
          test -n "${{ secrets.P12_PASSWORD }}" || (echo "Missing secret: P12_PASSWORD" && exit 1)
          test -n "${{ secrets.BUILD_PROVISION_PROFILE_APPSTORE_BASE64 }}" || (echo "Missing secret: BUILD_PROVISION_PROFILE_APPSTORE_BASE64" && exit 1)
          test -n "${{ secrets.KEYCHAIN_PASSWORD }}" || (echo "Missing secret: KEYCHAIN_PASSWORD" && exit 1)
          test -n "${{ secrets.APPLE_TEAM_ID }}" || (echo "Missing secret: APPLE_TEAM_ID" && exit 1)
          test -n "${{ secrets.APPSTORE_KEY_ID }}" || (echo "Missing secret: APPSTORE_KEY_ID" && exit 1)
          test -n "${{ secrets.APPSTORE_ISSUER_ID }}" || (echo "Missing secret: APPSTORE_ISSUER_ID" && exit 1)
          test -n "${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}" || (echo "Missing secret: APPSTORE_PRIVATE_KEY_BASE64" && exit 1)
          test -n "${{ secrets.TOMTOM_API_KEY_PRODUCTION }}" || (echo "Missing secret: TOMTOM_API_KEY_PRODUCTION" && exit 1)
          # R9a — sans cette cle, le SDK RevenueCat demarre a vide et la caisse
          # est MORTE dans une build par ailleurs verte. Mieux vaut un build rouge
          # qu une version sur l App Store qui ne sait rien vendre.
          test -n "${{ secrets.REVENUECAT_APPLE_API_KEY }}" || (echo "Missing secret: REVENUECAT_APPLE_API_KEY — la caisse serait morte dans la build" && exit 1)
          echo "All required iOS release secrets are present."

      # R9d — le champ n a plus de defaut, mais un envoi par API peut encore
      # arriver vide ou malforme : MARKETING_VERSION = ; dans le pbxproj.
      - name: Validate marketing version
        shell: bash
        run: python3 scripts/ci/ios/preparer_build.py version

      - name: Create production env file
        shell: bash
        env:
          API_ENV: ${{ github.event.inputs.api_env }}
          FC_FORCE_REVENUECAT_RAIL: ${{ github.event.inputs.force_revenuecat_rail }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TOMTOM_API_KEY_PRODUCTION: ${{ secrets.TOMTOM_API_KEY_PRODUCTION }}
          # Cle publique SDK RevenueCat iOS (appl_...).
          REVENUECAT_APPLE_API_KEY: ${{ secrets.REVENUECAT_APPLE_API_KEY }}
        # Temoin relu dans le journal : « CIBLE API DU BUILD : ... »
        run: python3 scripts/ci/ios/preparer_build.py env

      - name: Restore GoogleService-Info.plist (apparie a la cible API)
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_STAGING_BASE64 }}
          API_ENV: ${{ github.event.inputs.api_env }}
        # Pose le plist, verifie son projet (« PROJET FIREBASE DU BUILD : ... »)
        # puis synchronise le schema d'URL Firebase dans Info.plist.
        run: python3 scripts/ci/ios/preparer_build.py firebase

      - name: Decode signing assets
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_APPSTORE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_APPSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          cert = base64.b64decode(os.environ["BUILD_CERTIFICATE_BASE64"])
          profile = base64.b64decode(os.environ["BUILD_PROVISION_PROFILE_APPSTORE_BASE64"])

          Path("ci-signing").mkdir(exist_ok=True)
          Path("ci-signing/certificate.p12").write_bytes(cert)
          Path("ci-signing/profile.mobileprovision").write_bytes(profile)
          PY

      - name: Install certificate and provisioning profile
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import ci-signing/certificate.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i ci-signing/profile.mobileprovision > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ci-signing/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Using provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Create export options plist
        shell: bash
        run: |
          cat > ios/exportOptions.testflight.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Configure app target signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_MARKETING_VERSION: ${{ env.IOS_MARKETING_VERSION }}
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
        run: python3 scripts/ci/ios/preparer_build.py numeroter --signature-manuelle

      - name: Print release version metadata
        shell: bash
        run: |
          echo "Using iOS marketing version: ${IOS_MARKETING_VERSION}"
          echo "Using iOS build number: ${IOS_BUILD_NUMBER}"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/foundclub/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/foundclub/Info.plist || true

      - name: Build archive
        shell: bash
        env:
          SENTRY_ALLOW_FAILURE: "true"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -o pipefail
          mkdir -p ios/build
          LOG_PATH="ios/build/xcodebuild-archive.log"

          if ! xcodebuild \
            -workspace "${IOS_WORKSPACE}" \
            -scheme "${IOS_SCHEME}" \
            -configuration "${IOS_CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -archivePath ios/build/foundclub.xcarchive \
            clean archive 2>&1 | tee "$LOG_PATH"; then
            echo "xcodebuild archive failed. Extracting error lines:"
            grep -n "error:" "$LOG_PATH" || true
            exit 1
          fi

      - name: Upload archive log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-archive-log
          path: ios/build/xcodebuild-archive.log
          if-no-files-found: ignore

      - name: Export IPA
        shell: bash
        run: |
          xcodebuild -exportArchive \
            -archivePath ios/build/foundclub.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist ios/exportOptions.testflight.plist

      - name: Validate archived app version metadata
        shell: bash
        run: python3 scripts/ci/ios/preparer_build.py archive ios/build/foundclub.xcarchive

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundclub-ios-testflight-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error

      - name: Install App Store Connect API key
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          APPSTORE_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          export APPSTORE_KEY_PATH
          echo "APPSTORE_KEY_PATH=$APPSTORE_KEY_PATH" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          raw = os.environ["APPSTORE_PRIVATE_KEY_BASE64"].strip()
          output = Path(os.environ["APPSTORE_KEY_PATH"])

          def write_pem(text: str) -> None:
              normalized = text.replace("\r\n", "\n").replace("\r", "\n")
              if not normalized.endswith("\n"):
                  normalized += "\n"
              output.write_text(normalized, encoding="utf-8")

          if "BEGIN PRIVATE KEY" in raw:
              write_pem(raw)
          else:
              try:
                  decoded = base64.b64decode(raw, validate=True)
              except binascii.Error as exc:
                  raise SystemExit(f"APPSTORE_PRIVATE_KEY_BASE64 is not valid base64: {exc}")

              try:
                  decoded_text = decoded.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"Decoded App Store Connect key is not valid UTF-8 text: {exc}")

              write_pem(decoded_text)
          PY

          for dir in "$HOME/.appstoreconnect/private_keys" "$HOME/private_keys" "$HOME/.private_keys" "./private_keys"; do
            mkdir -p "$dir"
            cp "$APPSTORE_KEY_PATH" "$dir/AuthKey_${APPSTORE_KEY_ID}.p8"
            chmod 600 "$dir/AuthKey_${APPSTORE_KEY_ID}.p8"
          done

          test -s "$APPSTORE_KEY_PATH"
          grep -q '^-----BEGIN PRIVATE KEY-----$' "$APPSTORE_KEY_PATH"
          grep -q '^-----END PRIVATE KEY-----$' "$APPSTORE_KEY_PATH"
          openssl pkey -in "$APPSTORE_KEY_PATH" -noout >/dev/null

      - name: Confirm App Store Connect API key is ready for upload
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -s "$APPSTORE_KEY_PATH"
          test -n "$APPSTORE_KEY_ID"
          test -n "$APPSTORE_ISSUER_ID"
          echo "App Store Connect API key file is installed and upload step will perform the real authentication check."

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find ios/build/export -name '*.ipa' | head -n 1)"
          test -n "$IPA_PATH" || (echo "Unable to locate exported IPA" && exit 1)
          LOG_PATH="ios/build/altool-upload.log"

          set +e
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" 2>&1 | tee "$LOG_PATH"
          ALTOOL_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$ALTOOL_EXIT_CODE" -ne 0 ]; then
            echo "::error::App Store upload command failed with exit code $ALTOOL_EXIT_CODE."
            exit "$ALTOOL_EXIT_CODE"
          fi

          if grep -Eqi "UPLOAD FAILED|Validation failed|Failed to upload package|STATE_ERROR" "$LOG_PATH"; then
            echo "::error::App Store upload was rejected during validation. See altool-upload.log for details."
            exit 1
          fi

      - name: Upload App Store upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altool-upload-log
          path: ios/build/altool-upload.log
          if-no-files-found: ignore

      # ══════════════════════════════════════════════════════════════════════════
      # D52 — LA BUILD DOIT ARRIVER TOUTE SEULE CHEZ LES TESTEURS
      #
      # POURQUOI CES ETAPES EXISTENT. Le 2026-08-09, la 2.6.13 (941) est partie, ce
      # workflow a rendu `success` (UPLOAD SUCCEEDED with no errors + Delivery UUID),
      # et PERSONNE ne l'a vue dans TestFlight. Il manquait un dernier geste, fait a
      # la main : rattacher la build a un groupe de testeurs. Le colis arrivait bien
      # a l'entrepot, mais tant qu'on ne dit pas a qui le livrer il reste sur
      # l'etagere -- et RIEN dans le journal ne permettait de s'en apercevoir.
      #
      # CE QU'ELLES NE FONT JAMAIS : faire echouer une build dont l'ENVOI a reussi.
      # Un binaire correctement depose est un succes, meme si Apple traine ou si le
      # groupe est ambigu. D'ou `continue-on-error: true` sur les trois etapes ET
      # des scripts qui sortent toujours en 0 : ici on AVERTIT, on n'echoue pas.
      #
      # AUCUN SECRET NOUVEAU : on reutilise les trois deja installes plus haut
      # (APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, et le .p8 pose par l'etape
      # « Install App Store Connect API key », dont le chemin est dans
      # $APPSTORE_KEY_PATH). Le jeton JWT est signe par `openssl` et n'est JAMAIS
      # imprime, pas plus que le contenu de la clef.
      #
      # REGLAGES — variables de depot GitHub (Settings > Secrets and variables >
      # Actions > Variables). Toutes optionnelles, aucune n'est ecrite en dur dans
      # le script :
      #   vars.TESTFLIGHT_GROUP             nom EXACT du groupe de testeurs.
      #                                     Vide = detection automatique : s'il
      #                                     n'existe qu'UN seul groupe on le prend ;
      #                                     s'il y en a plusieurs on NE DEVINE PAS,
      #                                     on imprime la liste et on s'arrete la.
      #   vars.TESTFLIGHT_MAX_WAIT_MINUTES  plafond d'attente, defaut 40 min.
      #   vars.TESTFLIGHT_POLL_SECONDS      intervalle de sondage, defaut 60 s.
      # ══════════════════════════════════════════════════════════════════════════

      - name: Attendre qu Apple ait fini de traiter la build (TestFlight)
        continue-on-error: true
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TESTFLIGHT_MAX_WAIT_MINUTES: ${{ vars.TESTFLIGHT_MAX_WAIT_MINUTES || '40' }}
          TESTFLIGHT_POLL_SECONDS: ${{ vars.TESTFLIGHT_POLL_SECONDS || '60' }}
        run: python3 scripts/ci/ios/testflight_asc.py attendre

      - name: Distribuer la build au groupe de testeurs
        continue-on-error: true
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_GROUP }}
        run: python3 scripts/ci/ios/testflight_asc.py distribuer

      - name: ETAT TESTFLIGHT (temoin de fin de chaine)
        if: always()
        continue-on-error: true
        shell: bash
        run: python3 scripts/ci/ios/testflight_asc.py temoin
