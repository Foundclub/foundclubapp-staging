name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version iOS a envoyer sur TestFlight"
        required: true
        default: "1.7.13"
      api_env:
        description: "Cible API du build (production, ou staging pour la recette sandbox sur api-staging)"
        required: false
        default: "production"
      force_revenuecat_rail:
        description: "1 pour forcer le rail RevenueCat (recette sandbox), vide sinon"
        required: false
        default: ""

jobs:
  build-and-upload-testflight:
    runs-on: macos-latest
    env:
      APP_ENV: production
      ENV: production
      IOS_WORKSPACE: ios/foundclub.xcworkspace
      IOS_SCHEME: foundclub
      IOS_CONFIGURATION: Release
      IOS_BUNDLE_ID: com.foundclub
      IOS_MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_XCODE_MAJOR=26
          XCODE_CANDIDATE=""

          echo "Installed Xcode applications:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          # Ordre CROISSANT : on prend le Xcode 26 le PLUS ANCIEN qui satisfait l'exigence Apple
          # (majeure >= 26 pour les uploads apres 2026-04-28). RAISON : le pod `fmt` (11.0.2, impose
          # par RCT-Folly de RN 0.78) NE COMPILE PAS avec le Clang des Xcode 26 recents (26.6) ->
          # "call to consteval function ... is not a constant expression" dans format-inl.h.
          # Xcode 26.0.x compile fmt correctement. La plateforme iOS eventuellement manquante est
          # installee par l'etape suivante (-downloadPlatform), donc prendre un Xcode ancien est sans risque.
          for candidate in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V) /Applications/Xcode.app; do
            if [ ! -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ]; then
              continue
            fi

            version_output="$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version)"
            version="$(printf '%s\n' "$version_output" | awk '/^Xcode /{print $2; exit}')"
            major="${version%%.*}"
            echo "$candidate -> Xcode $version"

            if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge "$REQUIRED_XCODE_MAJOR" ]; then
              XCODE_CANDIDATE="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_CANDIDATE" ]; then
            echo "::error::Xcode 26 not found on this GitHub Actions runner. Use a macOS runner image that includes Xcode 26+ before uploading iOS builds after 2026-04-28."
            exit 1
          fi

          sudo xcode-select -s "$XCODE_CANDIDATE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_CANDIDATE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XCODE_CANDIDATE"

      - name: Ensure iOS platform (SDK) is installed
        shell: bash
        run: |
          set -uo pipefail
          # ⚠️ NE PAS conditionner sur `xcodebuild -showsdks` : il LISTE le SDK iOS meme quand la
          # PLATEFORME n'est pas installee. Le SDK suffit a compiler le C/ObjC (les pods passent),
          # mais ibtool echoue ensuite avec "LaunchScreen.storyboard: error: iOS 26.0 Platform Not
          # Installed". On lance donc le telechargement INCONDITIONNELLEMENT (idempotent : no-op
          # rapide si la plateforme est deja la, ~10 min sinon).
          echo "SDKs avant :"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || echo "  (aucun)"

          sudo xcodebuild -runFirstLaunch || true
          echo "Verification/telechargement de la plateforme iOS..."
          xcodebuild -downloadPlatform iOS || sudo xcodebuild -downloadPlatform iOS || {
            echo "::error::Echec de xcodebuild -downloadPlatform iOS sur ce runner."
            exit 1
          }

          echo "SDKs apres :"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || true

      - name: Validate Xcode and iOS SDK versions
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_XCODE_MAJOR=26
          REQUIRED_IOS_SDK_MAJOR=26

          xcode_version_output="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version_output"
          xcode_version="$(printf '%s\n' "$xcode_version_output" | awk '/^Xcode /{print $2; exit}')"
          xcode_major="${xcode_version%%.*}"

          if ! [[ "$xcode_major" =~ ^[0-9]+$ ]] || [ "$xcode_major" -lt "$REQUIRED_XCODE_MAJOR" ]; then
            echo "::error::Xcode 26+ is required, but selected Xcode version is '$xcode_version'."
            exit 1
          fi

          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          ios_sdk_major="${ios_sdk_version%%.*}"
          echo "iOS SDK version: $ios_sdk_version"

          if ! [[ "$ios_sdk_major" =~ ^[0-9]+$ ]] || [ "$ios_sdk_major" -lt "$REQUIRED_IOS_SDK_MAJOR" ]; then
            echo "::error::iOS SDK 26+ is required, but selected iphoneos SDK version is '$ios_sdk_version'."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Validate required runtime and signing secrets
        shell: bash
        run: |
          test -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64 }}" || (echo "Missing secret: GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64" && exit 1)
          test -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" || (echo "Missing secret: BUILD_CERTIFICATE_BASE64" && exit 1)
          test -n "${{ secrets.P12_PASSWORD }}" || (echo "Missing secret: P12_PASSWORD" && exit 1)
          test -n "${{ secrets.BUILD_PROVISION_PROFILE_APPSTORE_BASE64 }}" || (echo "Missing secret: BUILD_PROVISION_PROFILE_APPSTORE_BASE64" && exit 1)
          test -n "${{ secrets.KEYCHAIN_PASSWORD }}" || (echo "Missing secret: KEYCHAIN_PASSWORD" && exit 1)
          test -n "${{ secrets.APPLE_TEAM_ID }}" || (echo "Missing secret: APPLE_TEAM_ID" && exit 1)
          test -n "${{ secrets.APPSTORE_KEY_ID }}" || (echo "Missing secret: APPSTORE_KEY_ID" && exit 1)
          test -n "${{ secrets.APPSTORE_ISSUER_ID }}" || (echo "Missing secret: APPSTORE_ISSUER_ID" && exit 1)
          test -n "${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}" || (echo "Missing secret: APPSTORE_PRIVATE_KEY_BASE64" && exit 1)
          test -n "${{ secrets.TOMTOM_API_KEY_PRODUCTION }}" || (echo "Missing secret: TOMTOM_API_KEY_PRODUCTION" && exit 1)
          echo "All required iOS release secrets are present."

      - name: Create production env file
        shell: bash
        env:
          TOMTOM_API_KEY_PRODUCTION: ${{ secrets.TOMTOM_API_KEY_PRODUCTION }}
          # Clé publique SDK RevenueCat iOS (appl_...). Vide tant que le secret n'est
          # pas configuré : le rail d'achat store reste alors "Checkout indisponible".
          REVENUECAT_APPLE_API_KEY: ${{ secrets.REVENUECAT_APPLE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.api_env }}" = "staging" ]; then
            API_URL=https://api-staging.foundclubpro.com/api
            SOCKET_URL=https://api-staging.foundclubpro.com
          else
            API_URL=https://api.foundclubpro.com/api
            SOCKET_URL=https://api.foundclubpro.com
          fi
          cat > .env.production <<EOF
          APP_ENV=production
          API_URL=${API_URL}
          SOCKET_URL=${SOCKET_URL}
          WEB_APP_URL=https://foundclub.app
          SENTRY_DSN=
          FC_ENABLE_PUSH_NOTIFICATIONS=1
          FC_ENABLE_SMART_NOTIFICATIONS=1
          FC_ENABLE_NOTIFICATION_TEST_TRIGGER=0
          FC_SEARCH_MAP_PROVIDER=tomtom
          TOMTOM_API_KEY=${TOMTOM_API_KEY_PRODUCTION}
          REVENUECAT_APPLE_API_KEY=${REVENUECAT_APPLE_API_KEY}
          FC_FORCE_REVENUECAT_RAIL=${{ github.event.inputs.force_revenuecat_rail }}
          DELETE_ACCOUNT_URL=https://api.foundclubpro.com/suppression.html
          CONTACT_URL=https://foundclubpro.com
          EOF

          # Le heredoc n'affiche que le SCRIPT : sans ces deux lignes, aucun journal
          # de build ne dit quel serveur a ete embarque. Constate le 2026-07-29 sur
          # la 2.5.6, impossible a relire apres coup.
          echo "CIBLE API DU BUILD : ${API_URL}"
          grep -E '^(API_URL|SOCKET_URL)=' .env.production

      - name: Restore GoogleService-Info.plist (apparie a la cible API)
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64 }}
          GOOGLE_SERVICE_INFO_PLIST_STAGING_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_STAGING_BASE64 }}
          API_ENV: ${{ github.event.inputs.api_env }}
        run: |
          set -euo pipefail

          # APPARIEMENT OBLIGATOIRE client <-> serveur. Le serveur verifie le claim
          # "aud" du jeton Firebase contre son FIREBASE_PROJECT_ID ; un decalage rend
          # la connexion SMS impossible (400 a chaque tentative), et rien dans l'app
          # ne le signale. C'est ce qui a produit la 2.5.6 : l'entree api_env=staging
          # existait, mais le plist pose etait toujours celui de la production.
          #
          # ETAT DES SERVEURS, a re-verifier par
          #   docker exec <conteneur> printenv FIREBASE_PROJECT_ID
          #   api.foundclubpro.com          -> found-club
          #   api-staging.foundclubpro.com  -> found-club  DEPUIS LE 2026-07-30 (voie A-prime,
          #     GO Adel) : faute de plist iOS dedie, staging verifie les jetons du projet de
          #     PRODUCTION. Ses push sont eteints en echange (ENABLE_PUSH_NOTIFICATIONS=false)
          #     et il garde son propre compte de service, pour qu'un envoi accidentel soit
          #     refuse par Google au lieu d'atteindre de vrais telephones.
          #     Si staging retrouve un jour son projet propre, changer EXPECTED_PROJECT ici
          #     ET FIREBASE_PROJECT_ID sur le serveur : les deux ensemble, jamais l'un seul.
          EXPECTED_PROJECT=found-club

          # Un plist staging dedie, s'il existe un jour (voie B), prend le dessus.
          if [ "${API_ENV:-production}" = "staging" ] && [ -n "${GOOGLE_SERVICE_INFO_PLIST_STAGING_BASE64:-}" ]; then
            PLIST_B64="${GOOGLE_SERVICE_INFO_PLIST_STAGING_BASE64}"
            SECRET_NAME=GOOGLE_SERVICE_INFO_PLIST_STAGING_BASE64
          else
            PLIST_B64="${GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64:-}"
            SECRET_NAME=GOOGLE_SERVICE_INFO_PLIST_PRODUCTION_BASE64
          fi

          if [ -z "${PLIST_B64}" ]; then
            echo "::error::api_env=${API_ENV:-production} exige le secret ${SECRET_NAME}, qui est absent ou vide. Un build produit sans lui ne peut PAS se connecter au serveur vise : arret avant de fabriquer une build fantome."
            exit 1
          fi

          PLIST_B64="${PLIST_B64}" EXPECTED_PROJECT="${EXPECTED_PROJECT}" python3 - <<'PY'
          import base64
          import os
          import plistlib
          from pathlib import Path

          data = base64.b64decode(os.environ["PLIST_B64"])
          Path("ios/GoogleService-Info.plist").write_bytes(data)

          expected = os.environ["EXPECTED_PROJECT"]
          actual = str(plistlib.loads(data).get("PROJECT_ID", "")).strip()
          print(f"PROJET FIREBASE DU BUILD : {actual}")
          if actual != expected:
              raise SystemExit(
                  f"::error::Le plist Firebase porte le projet '{actual}' alors que le serveur vise attend '{expected}'. "
                  "La connexion SMS echouerait avec 'incorrect aud claim' : arret."
              )
          PY

      - name: Sync Firebase iOS URL scheme
        shell: bash
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          firebase_plist = Path("ios/GoogleService-Info.plist")
          info_plist = Path("ios/foundclub/Info.plist")

          firebase = plistlib.loads(firebase_plist.read_bytes())
          info = plistlib.loads(info_plist.read_bytes())

          google_app_id = str(firebase.get("GOOGLE_APP_ID", "")).strip()
          if not google_app_id:
              raise SystemExit("GOOGLE_APP_ID missing from ios/GoogleService-Info.plist")

          encoded_app_id = f'app-{google_app_id.replace(":", "-")}'
          url_types = info.get("CFBundleURLTypes", [])
          if not url_types:
              raise SystemExit("CFBundleURLTypes missing from ios/foundclub/Info.plist")

          schemes = url_types[0].get("CFBundleURLSchemes", [])
          if not schemes:
              raise SystemExit("CFBundleURLSchemes missing from ios/foundclub/Info.plist")

          schemes[0] = encoded_app_id
          url_types[0]["CFBundleURLSchemes"] = schemes
          info["CFBundleURLTypes"] = url_types

          info_plist.write_bytes(plistlib.dumps(info))
          print(f"Synced Firebase URL scheme: {encoded_app_id}")
          PY

      - name: Decode signing assets
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_APPSTORE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_APPSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          cert = base64.b64decode(os.environ["BUILD_CERTIFICATE_BASE64"])
          profile = base64.b64decode(os.environ["BUILD_PROVISION_PROFILE_APPSTORE_BASE64"])

          Path("ci-signing").mkdir(exist_ok=True)
          Path("ci-signing/certificate.p12").write_bytes(cert)
          Path("ci-signing/profile.mobileprovision").write_bytes(profile)
          PY

      - name: Install certificate and provisioning profile
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import ci-signing/certificate.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i ci-signing/profile.mobileprovision > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ci-signing/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Using provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Create export options plist
        shell: bash
        run: |
          cat > ios/exportOptions.testflight.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Configure app target signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_MARKETING_VERSION: ${{ env.IOS_MARKETING_VERSION }}
          IOS_BUILD_NUMBER: ${{ env.IOS_BUILD_NUMBER }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          pbxproj = Path("ios/foundclub.xcodeproj/project.pbxproj")
          text = pbxproj.read_text()

          replacements = {
              'PROVISIONING_PROFILE_SPECIFIER = "";': f'PROVISIONING_PROFILE_SPECIFIER = "{os.environ["PROFILE_NAME"]}";',
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";': '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";',
          }

          if 'DEVELOPMENT_TEAM = "";' in text:
              text = text.replace('DEVELOPMENT_TEAM = "";', f'DEVELOPMENT_TEAM = "{os.environ["APPLE_TEAM_ID"]}";')

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected setting not found in project.pbxproj: {old}")
              text = text.replace(old, new)

          text, current_project_version_count = re.subn(
              r'CURRENT_PROJECT_VERSION = [^;]+;',
              f'CURRENT_PROJECT_VERSION = {os.environ["IOS_BUILD_NUMBER"]};',
              text,
          )
          if current_project_version_count == 0:
              raise SystemExit("Expected at least one CURRENT_PROJECT_VERSION setting in project.pbxproj")

          text, marketing_version_count = re.subn(
              r'MARKETING_VERSION = [^;]+;',
              f'MARKETING_VERSION = {os.environ["IOS_MARKETING_VERSION"]};',
              text,
          )
          if marketing_version_count == 0:
              raise SystemExit("Expected at least one MARKETING_VERSION setting in project.pbxproj")

          pbxproj.write_text(text)
          PY

      - name: Print release version metadata
        shell: bash
        run: |
          echo "Using iOS marketing version: ${IOS_MARKETING_VERSION}"
          echo "Using iOS build number: ${IOS_BUILD_NUMBER}"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/foundclub/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/foundclub/Info.plist || true

      - name: Build archive
        shell: bash
        env:
          SENTRY_ALLOW_FAILURE: "true"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -o pipefail
          mkdir -p ios/build
          LOG_PATH="ios/build/xcodebuild-archive.log"

          if ! xcodebuild \
            -workspace "${IOS_WORKSPACE}" \
            -scheme "${IOS_SCHEME}" \
            -configuration "${IOS_CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -archivePath ios/build/foundclub.xcarchive \
            clean archive 2>&1 | tee "$LOG_PATH"; then
            echo "xcodebuild archive failed. Extracting error lines:"
            grep -n "error:" "$LOG_PATH" || true
            exit 1
          fi

      - name: Upload archive log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-archive-log
          path: ios/build/xcodebuild-archive.log
          if-no-files-found: ignore

      - name: Export IPA
        shell: bash
        run: |
          xcodebuild -exportArchive \
            -archivePath ios/build/foundclub.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist ios/exportOptions.testflight.plist

      - name: Validate archived app version metadata
        shell: bash
        run: |
          APP_INFO_PLIST="ios/build/foundclub.xcarchive/Products/Applications/foundclub.app/Info.plist"
          test -f "$APP_INFO_PLIST" || (echo "Archived app Info.plist not found" && exit 1)
          echo "Archived CFBundleShortVersionString:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO_PLIST"
          echo "Archived CFBundleVersion:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO_PLIST"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundclub-ios-testflight-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error

      - name: Install App Store Connect API key
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          APPSTORE_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          export APPSTORE_KEY_PATH
          echo "APPSTORE_KEY_PATH=$APPSTORE_KEY_PATH" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          raw = os.environ["APPSTORE_PRIVATE_KEY_BASE64"].strip()
          output = Path(os.environ["APPSTORE_KEY_PATH"])

          def write_pem(text: str) -> None:
              normalized = text.replace("\r\n", "\n").replace("\r", "\n")
              if not normalized.endswith("\n"):
                  normalized += "\n"
              output.write_text(normalized, encoding="utf-8")

          if "BEGIN PRIVATE KEY" in raw:
              write_pem(raw)
          else:
              try:
                  decoded = base64.b64decode(raw, validate=True)
              except binascii.Error as exc:
                  raise SystemExit(f"APPSTORE_PRIVATE_KEY_BASE64 is not valid base64: {exc}")

              try:
                  decoded_text = decoded.decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"Decoded App Store Connect key is not valid UTF-8 text: {exc}")

              write_pem(decoded_text)
          PY

          for dir in "$HOME/.appstoreconnect/private_keys" "$HOME/private_keys" "$HOME/.private_keys" "./private_keys"; do
            mkdir -p "$dir"
            cp "$APPSTORE_KEY_PATH" "$dir/AuthKey_${APPSTORE_KEY_ID}.p8"
            chmod 600 "$dir/AuthKey_${APPSTORE_KEY_ID}.p8"
          done

          test -s "$APPSTORE_KEY_PATH"
          grep -q '^-----BEGIN PRIVATE KEY-----$' "$APPSTORE_KEY_PATH"
          grep -q '^-----END PRIVATE KEY-----$' "$APPSTORE_KEY_PATH"
          openssl pkey -in "$APPSTORE_KEY_PATH" -noout >/dev/null

      - name: Confirm App Store Connect API key is ready for upload
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -s "$APPSTORE_KEY_PATH"
          test -n "$APPSTORE_KEY_ID"
          test -n "$APPSTORE_ISSUER_ID"
          echo "App Store Connect API key file is installed and upload step will perform the real authentication check."

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find ios/build/export -name '*.ipa' | head -n 1)"
          test -n "$IPA_PATH" || (echo "Unable to locate exported IPA" && exit 1)
          LOG_PATH="ios/build/altool-upload.log"

          set +e
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" 2>&1 | tee "$LOG_PATH"
          ALTOOL_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$ALTOOL_EXIT_CODE" -ne 0 ]; then
            echo "::error::App Store upload command failed with exit code $ALTOOL_EXIT_CODE."
            exit "$ALTOOL_EXIT_CODE"
          fi

          if grep -Eqi "UPLOAD FAILED|Validation failed|Failed to upload package|STATE_ERROR" "$LOG_PATH"; then
            echo "::error::App Store upload was rejected during validation. See altool-upload.log for details."
            exit 1
          fi

      - name: Upload App Store upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altool-upload-log
          path: ios/build/altool-upload.log
          if-no-files-found: ignore

      # ══════════════════════════════════════════════════════════════════════════
      # D52 — LA BUILD DOIT ARRIVER TOUTE SEULE CHEZ LES TESTEURS
      #
      # POURQUOI CES ETAPES EXISTENT. Le 2026-08-09, la 2.6.13 (941) est partie, ce
      # workflow a rendu `success` (UPLOAD SUCCEEDED with no errors + Delivery UUID),
      # et PERSONNE ne l'a vue dans TestFlight. Il manquait un dernier geste, fait a
      # la main : rattacher la build a un groupe de testeurs. Le colis arrivait bien
      # a l'entrepot, mais tant qu'on ne dit pas a qui le livrer il reste sur
      # l'etagere -- et RIEN dans le journal ne permettait de s'en apercevoir.
      #
      # CE QU'ELLES NE FONT JAMAIS : faire echouer une build dont l'ENVOI a reussi.
      # Un binaire correctement depose est un succes, meme si Apple traine ou si le
      # groupe est ambigu. D'ou `continue-on-error: true` sur les trois etapes ET
      # des scripts qui sortent toujours en 0 : ici on AVERTIT, on n'echoue pas.
      #
      # AUCUN SECRET NOUVEAU : on reutilise les trois deja installes plus haut
      # (APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, et le .p8 pose par l'etape
      # « Install App Store Connect API key », dont le chemin est dans
      # $APPSTORE_KEY_PATH). Le jeton JWT est signe par `openssl` et n'est JAMAIS
      # imprime, pas plus que le contenu de la clef.
      #
      # REGLAGES — variables de depot GitHub (Settings > Secrets and variables >
      # Actions > Variables). Toutes optionnelles, aucune n'est ecrite en dur dans
      # le script :
      #   vars.TESTFLIGHT_GROUP             nom EXACT du groupe de testeurs.
      #                                     Vide = detection automatique : s'il
      #                                     n'existe qu'UN seul groupe on le prend ;
      #                                     s'il y en a plusieurs on NE DEVINE PAS,
      #                                     on imprime la liste et on s'arrete la.
      #   vars.TESTFLIGHT_MAX_WAIT_MINUTES  plafond d'attente, defaut 40 min.
      #   vars.TESTFLIGHT_POLL_SECONDS      intervalle de sondage, defaut 60 s.
      # ══════════════════════════════════════════════════════════════════════════

      - name: Attendre qu Apple ait fini de traiter la build (TestFlight)
        continue-on-error: true
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TESTFLIGHT_MAX_WAIT_MINUTES: ${{ vars.TESTFLIGHT_MAX_WAIT_MINUTES || '40' }}
          TESTFLIGHT_POLL_SECONDS: ${{ vars.TESTFLIGHT_POLL_SECONDS || '60' }}
        run: |
          set -uo pipefail

          # Petit client App Store Connect, ecrit une fois et reutilise par les
          # etapes suivantes. Bibliotheque standard Python + `openssl` uniquement :
          # les deux sont deja utilises par ce workflow (cf. l'etape d'installation
          # de la clef), donc AUCUNE dependance nouvelle a installer.
          cat > "$RUNNER_TEMP/asc_client.py" <<'PY'
          """Client minimal de l'API App Store Connect (stdlib + openssl)."""
          import base64
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request

          API_ROOT = "https://api.appstoreconnect.apple.com"


          def _b64url(raw: bytes) -> str:
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode("ascii")


          def _der_to_jose(der: bytes) -> bytes:
              """DER (SEQUENCE{INTEGER r, INTEGER s}) -> r||s sur 2x32 octets.

              `openssl dgst -sign` rend une signature ECDSA au format DER ; JWS/ES256
              exige les deux entiers bruts concatenes. Pas de PyJWT sur le runner,
              donc on fait la conversion a la main -- c'est 15 lignes d'ASN.1 simple.
              """
              if not der or der[0] != 0x30:
                  raise ValueError("signature ECDSA inattendue (SEQUENCE absente)")
              index = 2
              if der[1] & 0x80:
                  index = 2 + (der[1] & 0x7F)
              parts = []
              for _ in range(2):
                  if der[index] != 0x02:
                      raise ValueError("signature ECDSA inattendue (INTEGER absent)")
                  length = der[index + 1]
                  value = der[index + 2:index + 2 + length]
                  index += 2 + length
                  parts.append(value.lstrip(b"\x00").rjust(32, b"\x00"))
              return b"".join(parts)


          def _token() -> str:
              """Jeton JWT ES256, regenere a chaque appel (Apple plafonne sa duree a
              20 min, or l'attente peut durer plus longtemps). Jamais imprime."""
              header = {"alg": "ES256", "kid": os.environ["APPSTORE_KEY_ID"], "typ": "JWT"}
              now = int(time.time())
              payload = {
                  "iss": os.environ["APPSTORE_ISSUER_ID"],
                  "iat": now,
                  "exp": now + 19 * 60,
                  "aud": "appstoreconnect-v1",
              }
              signing_input = "{}.{}".format(
                  _b64url(json.dumps(header, separators=(",", ":")).encode("utf-8")),
                  _b64url(json.dumps(payload, separators=(",", ":")).encode("utf-8")),
              )
              signed = subprocess.run(
                  ["openssl", "dgst", "-sha256", "-sign", os.environ["APPSTORE_KEY_PATH"]],
                  input=signing_input.encode("ascii"),
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True,
              )
              return "{}.{}".format(signing_input, _b64url(_der_to_jose(signed.stdout)))


          def request(method, path, body=None):
              """Rend (code HTTP, corps JSON). Ne leve jamais sur une erreur reseau."""
              url = path if path.startswith("http") else API_ROOT + path
              data = json.dumps(body).encode("utf-8") if body is not None else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", "Bearer " + _token())
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return response.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try:
                      return exc.code, (json.loads(raw) if raw else {})
                  except ValueError:
                      return exc.code, {"raw": raw[:500].decode("utf-8", "replace")}
              except Exception as exc:  # reseau, DNS, clef illisible...
                  return 0, {"raw": "{}: {}".format(type(exc).__name__, exc)}


          def detail(payload) -> str:
              """Message d'erreur d'Apple, lisible et sans secret."""
              errors = payload.get("errors") if isinstance(payload, dict) else None
              if errors:
                  return " | ".join(
                      "{}: {}".format(e.get("title", "?"), e.get("detail", "")).strip()
                      for e in errors
                  )
              return str(payload.get("raw", "")) if isinstance(payload, dict) else ""
          PY

          python3 - <<'PY'
          import os
          import sys
          import time
          from urllib.parse import urlencode

          sys.path.insert(0, os.environ["RUNNER_TEMP"])
          import asc_client as asc

          version = os.environ["IOS_MARKETING_VERSION"]
          build_number = os.environ["IOS_BUILD_NUMBER"]
          bundle_id = os.environ["IOS_BUNDLE_ID"]
          max_wait = int(os.environ.get("TESTFLIGHT_MAX_WAIT_MINUTES") or 40)
          poll = int(os.environ.get("TESTFLIGHT_POLL_SECONDS") or 60)

          ETIQUETTES = {
              "VALID": "traitee",
              "PROCESSING": "encore en traitement chez Apple",
              "ABSENTE": "pas encore visible chez Apple",
              "FAILED": "traitement en echec chez Apple",
              "INVALID": "refusee par Apple",
          }


          def publier(cle, valeur):
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write("{}={}\n".format(cle, valeur))


          etiquette_version = "{} ({})".format(version, build_number)
          publier("TESTFLIGHT_VERSION_LABEL", etiquette_version)
          publier("TESTFLIGHT_STATE", "INCONNU")
          publier("TESTFLIGHT_STATE_LABEL", "etat inconnu")

          # 1. Retrouver l'app par son bundle id (deja connu du workflow).
          status, payload = asc.request(
              "GET", "/v1/apps?" + urlencode({"filter[bundleId]": bundle_id, "limit": "1"})
          )
          if status != 200 or not payload.get("data"):
              print("::warning::App Store Connect ne rend pas l'app {} (HTTP {}). {} "
                    "L'ENVOI DU BINAIRE, LUI, A REUSSI : rien n'est perdu, il reste a "
                    "rattacher la build a un groupe de testeurs a la main."
                    .format(bundle_id, status, asc.detail(payload)))
              raise SystemExit(0)

          app_id = payload["data"][0]["id"]
          publier("TESTFLIGHT_APP_ID", app_id)
          print("App Store Connect : {} -> app id {}".format(bundle_id, app_id))
          print("Build recherchee : version {} / numero de build {} "
                "(JAMAIS « la plus recente » : deux workflows peuvent se croiser)"
                .format(version, build_number))
          print("Plafond d'attente : {} min, sondage toutes les {} s".format(max_wait, poll))

          # 2. Sonder CETTE build (version + numero), jamais la derniere arrivee.
          requete = "/v1/builds?" + urlencode({
              "filter[app]": app_id,
              "filter[preReleaseVersion.version]": version,
              "filter[version]": build_number,
              "limit": "1",
          })

          depart = time.monotonic()
          echeance = depart + max_wait * 60
          etat, build_id = "ABSENTE", ""

          while True:
              status, payload = asc.request("GET", requete)
              minutes = int((time.monotonic() - depart) / 60)
              if status != 200:
                  etat = "HTTP_{}".format(status)
                  print("[TestFlight] t+{:>2} min | {} | appel API en echec ({}) {}"
                        .format(minutes, etiquette_version, etat, asc.detail(payload)))
              elif not payload.get("data"):
                  etat = "ABSENTE"
                  print("[TestFlight] t+{:>2} min | {} | pas encore enregistree chez Apple"
                        .format(minutes, etiquette_version))
              else:
                  entree = payload["data"][0]
                  build_id = str(entree.get("id", ""))
                  etat = str(entree.get("attributes", {}).get("processingState") or "INCONNU")
                  print("[TestFlight] t+{:>2} min | {} | {}"
                        .format(minutes, etiquette_version, etat))
                  if etat != "PROCESSING":
                      break

              if time.monotonic() + poll >= echeance:
                  break
              time.sleep(poll)

          publier("TESTFLIGHT_STATE", etat)
          publier("TESTFLIGHT_BUILD_ID", build_id)
          publier("TESTFLIGHT_STATE_LABEL", ETIQUETTES.get(etat, "etat inconnu ({})".format(etat)))

          if etat == "VALID":
              print("Apple a fini : {} est traitee (build id {}).".format(etiquette_version, build_id))
          elif etat in ("PROCESSING", "ABSENTE"):
              print("::warning::Apple n'avait pas fini de traiter {} au bout de {} min "
                    "(etat : {}). L'ENVOI A REUSSI et le binaire est bien chez Apple ; "
                    "il ne manque que le rattachement au groupe de testeurs. Relever "
                    "vars.TESTFLIGHT_MAX_WAIT_MINUTES, ou rattacher a la main dans "
                    "App Store Connect."
                    .format(etiquette_version, max_wait, etat))
          else:
              print("::warning::Apple rend l'etat '{}' pour {}. L'envoi a reussi, mais la "
                    "build n'est pas distribuable en l'etat : regarder TestFlight."
                    .format(etat, etiquette_version))
          PY

      - name: Distribuer la build au groupe de testeurs
        continue-on-error: true
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_GROUP }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlencode

          sys.path.insert(0, os.environ["RUNNER_TEMP"])
          import asc_client as asc


          def publier(cle, valeur):
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write("{}={}\n".format(cle, valeur))


          etat = os.environ.get("TESTFLIGHT_STATE", "INCONNU")
          build_id = os.environ.get("TESTFLIGHT_BUILD_ID", "")
          app_id = os.environ.get("TESTFLIGHT_APP_ID", "")
          voulu = (os.environ.get("TESTFLIGHT_GROUP") or "").strip()

          # Defaut pessimiste : le temoin de fin de chaine ne dira « distribuee »
          # que si un POST a reellement reussi.
          publier("TESTFLIGHT_DISTRIBUTION", "non distribuee")

          if etat != "VALID" or not build_id or not app_id:
              print("::warning::Distribution non tentee : la build n'est pas au statut "
                    "VALID (etat lu : {}). L'envoi du binaire reste un succes.".format(etat))
              publier("TESTFLIGHT_DISTRIBUTION",
                      "non distribuee (build non traitee : {})".format(etat))
              raise SystemExit(0)

          # 1. LIRE les groupes existants avant toute chose : le nom ne se devine pas.
          status, payload = asc.request(
              "GET", "/v1/betaGroups?" + urlencode({"filter[app]": app_id, "limit": "200"})
          )
          if status != 200:
              print("::warning::Impossible de lire la liste des groupes de test "
                    "(HTTP {}). {}".format(status, asc.detail(payload)))
              publier("TESTFLIGHT_DISTRIBUTION",
                      "non distribuee (liste des groupes illisible, HTTP {})".format(status))
              raise SystemExit(0)

          groupes = [
              {
                  "id": g.get("id", ""),
                  "nom": str(g.get("attributes", {}).get("name") or ""),
                  "interne": bool(g.get("attributes", {}).get("isInternalGroup")),
              }
              for g in payload.get("data", [])
          ]

          print("GROUPES DE TEST DECLARES SUR CETTE APP : {}".format(len(groupes)))
          for g in groupes:
              print("  - « {} »  ({})".format(g["nom"], "interne" if g["interne"] else "externe"))

          # 2. Choisir. Un seul groupe -> on le prend. Plusieurs -> ON NE DEVINE PAS.
          if not groupes:
              print("::warning::Aucun groupe de test n'existe sur cette app. Creer un "
                    "groupe dans App Store Connect (TestFlight > Groupes), puis "
                    "renseigner vars.TESTFLIGHT_GROUP si vous en gardez plusieurs.")
              publier("TESTFLIGHT_DISTRIBUTION", "non distribuee (aucun groupe n'existe)")
              raise SystemExit(0)

          if voulu:
              choisis = [g for g in groupes if g["nom"] == voulu] or \
                        [g for g in groupes if g["nom"].casefold() == voulu.casefold()]
              if not choisis:
                  print("::warning::Le groupe « {} » (vars.TESTFLIGHT_GROUP) n'existe pas "
                        "sur cette app. Les noms reels sont listes juste au-dessus : "
                        "rien n'a ete distribue, par prudence.".format(voulu))
                  publier("TESTFLIGHT_DISTRIBUTION",
                          "non distribuee (groupe « {} » introuvable)".format(voulu))
                  raise SystemExit(0)
              cible = choisis[0]
              print("Groupe choisi par reglage (vars.TESTFLIGHT_GROUP) : « {} »".format(cible["nom"]))
          elif len(groupes) == 1:
              cible = groupes[0]
              print("Un seul groupe existe : « {} ». C'est lui, sans ambiguite."
                    .format(cible["nom"]))
          else:
              print("::warning::{} groupes de test existent et aucun n'est designe. "
                    "Distribuer au mauvais groupe enverrait une version de recette a des "
                    "gens qui ne l'attendent pas : RIEN N'A ETE DISTRIBUE. Choisir un nom "
                    "dans la liste ci-dessus et le poser dans la variable de depot "
                    "TESTFLIGHT_GROUP (Settings > Secrets and variables > Actions > "
                    "Variables).".format(len(groupes)))
              publier("TESTFLIGHT_DISTRIBUTION",
                      "non distribuee ({} groupes possibles, aucun designe)".format(len(groupes)))
              raise SystemExit(0)

          # 3. Rattacher. 204 = c'est fait (« Add Builds to a Beta Group »).
          status, payload = asc.request(
              "POST",
              "/v1/betaGroups/{}/relationships/builds".format(cible["id"]),
              {"data": [{"type": "builds", "id": build_id}]},
          )
          if status in (200, 201, 204):
              print("Build {} rattachee au groupe « {} » (HTTP {})."
                    .format(build_id, cible["nom"], status))
              publier("TESTFLIGHT_DISTRIBUTION",
                      "distribuee au groupe « {} »".format(cible["nom"]))
              if not cible["interne"]:
                  print("::warning::« {} » est un groupe EXTERNE : Apple exige une "
                        "Beta App Review avant que ces testeurs recoivent la build. "
                        "Les groupes INTERNES, eux, la recoivent tout de suite."
                        .format(cible["nom"]))
          else:
              print("::warning::Le rattachement au groupe « {} » a ete refuse (HTTP {}). {} "
                    "L'envoi du binaire reste un succes ; le rattachement peut se faire "
                    "a la main dans App Store Connect."
                    .format(cible["nom"], status, asc.detail(payload)))
              publier("TESTFLIGHT_DISTRIBUTION",
                      "non distribuee (rattachement refuse, HTTP {})".format(status))
          PY

      - name: ETAT TESTFLIGHT (temoin de fin de chaine)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          # Ce temoin s'imprime TOUJOURS, meme si les deux etapes precedentes ont
          # renonce : c'est lui qu'on relit, au meme titre que « CIBLE API DU BUILD »,
          # « PROJET FIREBASE DU BUILD » et « UPLOAD SUCCEEDED ».
          ETIQUETTE="${TESTFLIGHT_VERSION_LABEL:-${IOS_MARKETING_VERSION} (${IOS_BUILD_NUMBER})}"
          ETAT="${TESTFLIGHT_STATE_LABEL:-etat inconnu}"
          DIFFUSION="${TESTFLIGHT_DISTRIBUTION:-non distribuee (etapes de distribution non executees)}"
          LIGNE="ETAT TESTFLIGHT : ${ETIQUETTE} — ${ETAT} — ${DIFFUSION}"
          echo "$LIGNE"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "$LIGNE" >> "$GITHUB_STEP_SUMMARY"
          fi
