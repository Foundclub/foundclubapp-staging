# TEMPORAIRE (lot CI-ANDROID, 16/09/2026) : sonde de l'etape « Setup Android SDK ».
# Ne construit rien, ne publie rien. Supprime par le commit suivant du lot.
name: TMP CI-ANDROID setup-sdk probe

on:
  push:
    branches:
      - fix/CI-android-setup-sdk
    paths:
      - .github/workflows/tmp-ci-android-setup-sdk-probe.yml

permissions:
  contents: read

jobs:
  # Temoin ROUGE : l'etape telle qu'elle est sur staging (paquets par defaut « tools platform-tools »).
  # Le job est vert si et seulement si l'ancienne etape ECHOUE.
  avant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (etape de staging, inchangee)
        id: sdk
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: L'ancienne etape doit echouer
        shell: bash
        run: |
          echo "outcome = ${{ steps.sdk.outcome }}"
          test "${{ steps.sdk.outcome }}" = "failure"

  # Temoin VERT : l'etape corrigee, identique a celle des deux workflows.
  apres:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Paquets installes
        shell: bash
        run: |
          which sdkmanager
          sdkmanager --list_installed
          adb --version
