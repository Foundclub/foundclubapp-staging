name: TestFlight - etat chez Apple (lecture seule)

# Qui est chez Apple, et dans quel etat ? Depuis le 2026-09-25 les TestFlight se
# construisent sur CODEMAGIC, hors de GitHub : `gh run list` ne les voit plus.
# Ce workflow LIT App Store Connect avec la cle deja rangee dans les secrets de
# ce depot et imprime les 5 dernieres builds (version, numero, etat, date).
# Aucune ecriture chez Apple. ~1 minute de Linux.
#   gh workflow run testflight-etat.yml --ref staging
#   gh run view <id> --log | grep -A6 "DERNIERES BUILDS"
# (Pour relire l'etat plus tard sans rien pousser : gh run rerun <id>.)
# Mode d'emploi : D:/App/fc/CONSTRUIRE_LES_VERSIONS.md

on:
  workflow_dispatch:

jobs:
  lire-etat-apple:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dernieres builds chez Apple
        shell: bash
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # Meme lecture du secret que l'etape « Install App Store Connect API
          # key » de ios-testflight-release.yml : PEM en clair ou en base64.
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPSTORE_PRIVATE_KEY_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_PRIVATE_KEY_BASE64" > "$KEY"
          else
            printf '%s' "$APPSTORE_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          APPSTORE_KEY_PATH="$KEY" python3 scripts/ci/ios/testflight_asc.py prochain-numero
