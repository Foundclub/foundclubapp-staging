name: iOS Build Artifact

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      APP_ENV: staging
      ENV: staging
      IOS_WORKSPACE: ios/foundclub.xcworkspace
      IOS_SCHEME: foundclub
      IOS_CONFIGURATION: Release
      IOS_BUNDLE_ID: com.foundclub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_XCODE_MAJOR=26
          XCODE_CANDIDATE=""

          echo "Installed Xcode applications:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          # Ordre CROISSANT : on prend le Xcode 26 le PLUS ANCIEN qui satisfait l'exigence Apple
          # (majeure >= 26 pour les uploads apres 2026-04-28). RAISON : le pod `fmt` (11.0.2, impose
          # par RCT-Folly de RN 0.78) NE COMPILE PAS avec le Clang des Xcode 26 recents (26.6) ->
          # "call to consteval function ... is not a constant expression" dans format-inl.h.
          # Xcode 26.0.x compile fmt correctement. La plateforme iOS eventuellement manquante est
          # installee par l'etape suivante (-downloadPlatform), donc prendre un Xcode ancien est sans risque.
          for candidate in $(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V) /Applications/Xcode.app; do
            if [ ! -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ]; then
              continue
            fi

            version_output="$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version)"
            version="$(printf '%s\n' "$version_output" | awk '/^Xcode /{print $2; exit}')"
            major="${version%%.*}"
            echo "$candidate -> Xcode $version"

            if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge "$REQUIRED_XCODE_MAJOR" ]; then
              XCODE_CANDIDATE="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_CANDIDATE" ]; then
            echo "::error::Xcode 26 not found on this GitHub Actions runner. Use a macOS runner image that includes Xcode 26+ before uploading iOS builds after 2026-04-28."
            exit 1
          fi

          sudo xcode-select -s "$XCODE_CANDIDATE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_CANDIDATE/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XCODE_CANDIDATE"

      - name: Ensure iOS platform (SDK) is installed
        shell: bash
        run: |
          set -uo pipefail
          # ⚠️ NE PAS conditionner sur `xcodebuild -showsdks` : il LISTE le SDK iOS meme quand la
          # PLATEFORME n'est pas installee. Le SDK suffit a compiler le C/ObjC (les pods passent),
          # mais ibtool echoue ensuite avec "LaunchScreen.storyboard: error: iOS 26.0 Platform Not
          # Installed". On lance donc le telechargement INCONDITIONNELLEMENT (idempotent : no-op
          # rapide si la plateforme est deja la, ~10 min sinon).
          echo "SDKs avant :"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || echo "  (aucun)"

          sudo xcodebuild -runFirstLaunch || true
          echo "Verification/telechargement de la plateforme iOS..."
          xcodebuild -downloadPlatform iOS || sudo xcodebuild -downloadPlatform iOS || {
            echo "::error::Echec de xcodebuild -downloadPlatform iOS sur ce runner."
            exit 1
          }

          echo "SDKs apres :"
          xcodebuild -showsdks 2>/dev/null | grep -i ios || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Upload regenerated Podfile.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: ios/Podfile.lock
          if-no-files-found: error

      - name: Validate required signing secrets
        shell: bash
        run: |
          test -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" || (echo "Missing secret: GOOGLE_SERVICE_INFO_PLIST_BASE64" && exit 1)
          test -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" || (echo "Missing secret: BUILD_CERTIFICATE_BASE64" && exit 1)
          test -n "${{ secrets.P12_PASSWORD }}" || (echo "Missing secret: P12_PASSWORD" && exit 1)
          test -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" || (echo "Missing secret: BUILD_PROVISION_PROFILE_BASE64" && exit 1)
          test -n "${{ secrets.KEYCHAIN_PASSWORD }}" || (echo "Missing secret: KEYCHAIN_PASSWORD" && exit 1)
          test -n "${{ secrets.APPLE_TEAM_ID }}" || (echo "Missing secret: APPLE_TEAM_ID" && exit 1)
          echo "All required signing secrets are present."

      - name: Restore GoogleService-Info.plist
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          data = base64.b64decode(os.environ["GOOGLE_SERVICE_INFO_PLIST_BASE64"])
          Path("ios/GoogleService-Info.plist").write_bytes(data)
          PY
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Decode signing assets
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          cert = base64.b64decode(os.environ["BUILD_CERTIFICATE_BASE64"])
          profile = base64.b64decode(os.environ["BUILD_PROVISION_PROFILE_BASE64"])

          Path("ci-signing").mkdir(exist_ok=True)
          Path("ci-signing/certificate.p12").write_bytes(cert)
          Path("ci-signing/profile.mobileprovision").write_bytes(profile)
          PY
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}

      - name: Install certificate and provisioning profile
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import ci-signing/certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i ci-signing/profile.mobileprovision > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ci-signing/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Using provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Create export options plist
        shell: bash
        run: |
          cat > ios/exportOptions.ci.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Configure app target signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          pbxproj = Path("ios/foundclub.xcodeproj/project.pbxproj")
          text = pbxproj.read_text()

          replacements = {
              'DEVELOPMENT_TEAM = "";': f'DEVELOPMENT_TEAM = "{os.environ["APPLE_TEAM_ID"]}";',
              'PROVISIONING_PROFILE_SPECIFIER = "";': f'PROVISIONING_PROFILE_SPECIFIER = "{os.environ["PROFILE_NAME"]}";',
              '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";': '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected setting not found in project.pbxproj: {old}")
              text = text.replace(old, new)

          pbxproj.write_text(text)
          PY
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build archive
        shell: bash
        env:
          SENTRY_ALLOW_FAILURE: "true"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -o pipefail
          mkdir -p ios/build
          LOG_PATH="ios/build/xcodebuild-archive.log"

          if ! xcodebuild \
            -workspace "${IOS_WORKSPACE}" \
            -scheme "${IOS_SCHEME}" \
            -configuration "${IOS_CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -archivePath ios/build/foundclub.xcarchive \
            clean archive 2>&1 | tee "$LOG_PATH"; then
            echo "xcodebuild archive failed. Extracting error lines:"
            grep -n "error:" "$LOG_PATH" || true
            exit 1
          fi

      - name: Upload archive log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-archive-log
          path: ios/build/xcodebuild-archive.log
          if-no-files-found: ignore

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ios/build/foundclub.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist ios/exportOptions.ci.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: foundclub-ios-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error

      - name: Validate Firebase distribution secrets
        shell: bash
        run: |
          test -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}" || (echo "Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" && exit 1)
          test -n "${{ secrets.FIREBASE_APP_ID_IOS }}" || (echo "Missing secret: FIREBASE_APP_ID_IOS" && exit 1)
          test -n "${{ secrets.FIREBASE_GROUPS }}" || (echo "Missing secret: FIREBASE_GROUPS" && exit 1)
          echo "All Firebase distribution secrets are present."

      - name: Restore Firebase service account
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          data = base64.b64decode(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON_BASE64"])
          Path("ci-firebase").mkdir(exist_ok=True)
          Path("ci-firebase/firebase-service-account.json").write_bytes(data)
          PY
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute IPA to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/ci-firebase/firebase-service-account.json
        run: |
          firebase appdistribution:distribute ios/build/export/*.ipa \
            --app "${{ secrets.FIREBASE_APP_ID_IOS }}" \
            --groups "${{ secrets.FIREBASE_GROUPS }}" \
            --release-notes "GitHub Actions iOS build ${{ github.sha }}"
