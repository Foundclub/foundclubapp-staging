apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

// R18 (02/09/2026) - CE N EST PAS UNE CLE, C EST UN TROU BOUCHE AVEC DU PAPIER.
// Quand ni GOOGLE_MAPS_ANDROID_API_KEY_PRODUCTION (variable d environnement ou
// propriete gradle googleMapsApiKeyProduction) n est fournie, cette chaine part
// telle quelle dans le manifeste, meta-data com.google.android.geo.API_KEY
// (AndroidManifest.xml:34) - et AUCUN workflow ne la fournit aujourd hui.
//
// Pourquoi ca ne casse rien pour l instant : la carte de recherche est rendue
// par TOMTOM (FC_SEARCH_MAP_PROVIDER=tomtom dans les 2 fichiers .env produits
// par la CI, et searchMapProvider.js retombe de toute facon sur tomtom). Le seul
// fichier qui importe react-native-maps est LegacySearchMapNative.js, qui n est
// monte que sur le provider "legacy". La cle est donc INERTE.
// ATTENTION : Elle redeviendra bloquante le jour ou on repasse sur le provider legacy :
// carte grise et "Authorization failure" sur tous les telephones Android.
//
// La vraie cle est un secret d Adel : elle se pose en secret de depot
// GOOGLE_MAPS_ANDROID_API_KEY_PRODUCTION, jamais dans ce fichier.
def MAPS_API_KEY_PLACEHOLDER = "CLE_TEMPORAIRE_A_REMPLACER"
def productionGoogleServicesFile = file("src/production/google-services.json")
def hasProductionGoogleServices = productionGoogleServicesFile.exists()
def debuggableVariantNames = ["stagingDebug"]

def normalizeSecretValue = { value ->
    def normalized = (value ?: '').toString().trim()
    return normalized ? normalized : null
}

def resolveBuildSecret = { envName, propertyNames = [] ->
    def envValue = normalizeSecretValue(System.getenv(envName))
    if (envValue) {
        return envValue
    }

    for (def propertyName : ([envName] + propertyNames).findAll { it }) {
        if (!project.hasProperty(propertyName)) {
            continue
        }

        def propertyValue = normalizeSecretValue(project.findProperty(propertyName))
        if (propertyValue) {
            return propertyValue
        }
    }

    return null
}

def productionMapsApiKey = resolveBuildSecret(
    'GOOGLE_MAPS_ANDROID_API_KEY_PRODUCTION',
    ['googleMapsApiKeyProduction']
)
def stagingMapsApiKey = resolveBuildSecret(
    'GOOGLE_MAPS_ANDROID_API_KEY_STAGING',
    ['googleMapsApiKeyStaging']
)

if (hasProductionGoogleServices) {
    debuggableVariantNames << "productionDebug"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = debuggableVariantNames

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute().text.trim(), "../sentry.gradle")
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.foundclub"
    defaultConfig {
        applicationId "com.foundclub"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode project.hasProperty('versionCode') ? project.property('versionCode') as int : 1
        versionName project.hasProperty('versionName') ? project.property('versionName') : "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file("keystore")
            storePassword project.hasProperty('RELEASE_STORE_PASSWORD') ? project.RELEASE_STORE_PASSWORD : ''
            keyAlias "foundclub"
            keyPassword project.hasProperty('RELEASE_KEY_PASSWORD') ? project.RELEASE_KEY_PASSWORD : ''
        }
        staging {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    flavorDimensions "env"
    productFlavors {
        production {
            dimension "env"
            signingConfig signingConfigs.release
            manifestPlaceholders = [googleMapsApiKey: productionMapsApiKey ?: MAPS_API_KEY_PLACEHOLDER]
            resValue "string", "app_name", "FoundClub"
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            signingConfig signingConfigs.staging
            manifestPlaceholders = [googleMapsApiKey: stagingMapsApiKey ?: MAPS_API_KEY_PLACEHOLDER]
            versionNameSuffix "-staging"
            resValue "string", "app_name", "FoundClub Staging"
        }
    }
    variantFilter { variant ->
        if (variant.flavors*.name.contains("production") && !hasProductionGoogleServices) {
            setIgnore(true)
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
